<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <title>Nativo English</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#1F3A5F" />
    <meta name="apple-mobile-web-app-title" content="Nativo" />
    <meta name="application-name" content="Nativo" />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('nativo_theme_preference');
          var mode = stored === 'light' || stored === 'dark' || stored === 'system' ? stored : 'system';
          var isDark = mode === 'dark' || (mode === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          var resolved = isDark ? 'dark' : 'light';
          var root = document.documentElement;
          root.classList.toggle('dark', isDark);
          root.classList.toggle('light', !isDark);
          root.setAttribute('data-theme', resolved);
          root.setAttribute('data-theme-mode', mode);
          root.style.colorScheme = resolved;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
